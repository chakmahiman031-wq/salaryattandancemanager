name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and make Gradle executable
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"

      - name: Build Debug APK
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Using Gradle project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
