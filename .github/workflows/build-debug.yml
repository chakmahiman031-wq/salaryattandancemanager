name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x SalaryAttendanceManager/gradlew

      - name: Build Debug APK
        working-directory: SalaryAttendanceManager
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SalaryAttendanceManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
